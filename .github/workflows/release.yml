# GitHub Release Workflow
# Drafts a GitHub Release when a package tag <package>-v<version> is pushed
# (e.g. canvod-filemap-v0.2.0, canvod-adapters-v0.3.0rc1).
# https://docs.github.com/en/actions/using-workflows

name: Release

on:
  push:
    tags:
      - "canvod-*-v*"

permissions: read-all

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Read the package and version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="${TAG%-v*}"
          version="${TAG##*-v}"
          if [ ! -d "packages/${pkg}" ]; then
            echo "::error::Tag ${TAG} names no package under packages/"
            exit 1
          fi
          declared=$(uv version --package "${pkg}" --short --frozen)
          if [ "${declared}" != "${version}" ]; then
            echo "::error::Tag ${TAG} does not match packages/${pkg} version ${declared}"
            exit 1
          fi
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from the package's commits
        env:
          PKG: ${{ steps.tag.outputs.package }}
        run: |
          uvx git-cliff --include-path "packages/${PKG}/**" --tag-pattern "^${PKG}-v[0-9]" \
            --latest --strip all > release-notes.md
          cat release-notes.md

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ steps.tag.outputs.package }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # PEP 440 pre-releases: 0.2.0a1, 0.2.0b1, 0.2.0rc1
          if echo "${VERSION}" | grep -qE '(a|b|rc)[0-9]+$'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${PKG} ${VERSION}" \
            --notes-file release-notes.md \
            --draft \
            ${PRERELEASE} \
            --verify-tag

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Draft release created: ${TAG}"
          echo "Review at: https://github.com/${{ github.repository }}/releases"
          echo "Publish the release manually when ready"
