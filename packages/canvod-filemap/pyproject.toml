[project]
name = "canvod-filemap"
version = "0.1.0"
description = "Naming recipes that map non-canonical GNSS-T filenames to canVOD names"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "canvod-preflight>=0.4.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "natsort>=8.4.0",
]

[project.urls]
Homepage = "https://github.com/nfb2021/canvodpy-extensions"
Documentation = "https://nfb2021.github.io/canvodpy-extensions/packages/filemap/overview/"
Repository = "https://github.com/nfb2021/canvodpy-extensions"
Issues = "https://github.com/nfb2021/canvodpy-extensions/issues"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "canvod.filemap"
