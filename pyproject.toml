# ============================================================================
# Workspace Configuration — canvodpy-extensions
# ============================================================================
# Optional extension packages for canvodpy. Not part of the core monorepo.
# GitHub-only by design — install via git-subdirectory sources (see READMEs).
#
# Packages:
#   canvod-filemap  — recipe-based filename mapping for non-canonical
#                              GNSS filenames; slot-in for canvodpy >= 0.3.0
#   canvod-airflow           — Airflow DAG definitions for canvodpy pipelines
#   canvod-adapters          — bidirectional data adapters between canvodpy
#                              and third-party GNSS-VOD tools (gnssvod, ...)

[tool.uv.workspace]
members = ["packages/*"]

# canvod-filemap uses the canVOD naming convention of canvod-preflight, which
# is not on PyPI yet; canvod-adapters uses the observation code mapping and
# the dataset contracts of canvod-readers and the VOD store's contract check,
# which are not released yet; canvod-airflow calls canvodpy.workflows.tasks,
# which is not released yet either. Branch until canvodpy is released with
# them. All canvodpy packages come from the same branch, so the extensions
# are tested against one canvodpy state.
[tool.uv.sources]
canvodpy = { git = "https://github.com/nfb2021/canvodpy.git", subdirectory = "canvodpy", branch = "fix/gnssgeodesy-upstream-bugs" }
canvod-preflight = { git = "https://github.com/nfb2021/canvodpy.git", subdirectory = "packages/canvod-preflight", branch = "fix/gnssgeodesy-upstream-bugs" }
canvod-readers = { git = "https://github.com/nfb2021/canvodpy.git", subdirectory = "packages/canvod-readers", branch = "fix/gnssgeodesy-upstream-bugs" }
canvod-store = { git = "https://github.com/nfb2021/canvodpy.git", subdirectory = "packages/canvod-store", branch = "fix/gnssgeodesy-upstream-bugs" }
canvod-utils = { git = "https://github.com/nfb2021/canvodpy.git", subdirectory = "packages/canvod-utils", branch = "fix/gnssgeodesy-upstream-bugs" }

# ============================================================================
# Development Dependencies (Workspace-wide)
# ============================================================================

[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "mkdocstrings-python>=2.0.9",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "zensical>=0.0.67",
]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = [
    "packages/canvod-filemap/tests",
    "packages/canvod-airflow/tests",
    "packages/canvod-adapters/tests",
]
addopts = "--cov --cov-report term-missing --cov-report lcov -rsx --verbose --color=yes"
markers = [
    "integration: marks tests as integration tests (may require config files or external resources)",
]

[tool.coverage.run]
relative_files = true
source = [
    "packages/canvod-filemap/src",
    "packages/canvod-airflow/src",
    "packages/canvod-adapters/src",
]

# ============================================================================
# ty Configuration (Type Checking)
# ============================================================================

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Ignore unresolved imports: canvod-airflow's `apache-airflow` dependency is
# an optional extra (not installed in a plain dev sync), and workspace
# packages may not all be installed in isolation.
unresolved-import = "ignore"

# ============================================================================
# Commitizen Configuration (Conventional Commits)
# ============================================================================

# Checks commit messages only (commit-msg hook). Versions, changelogs and tags
# are per package: see "Release Management" in the Justfile.
[tool.commitizen]
name = "cz_conventional_commits"
